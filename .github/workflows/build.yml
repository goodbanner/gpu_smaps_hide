name: build-smaps-hide
on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: 'AOSP common GKI ref to build against. Device runs android15-6.6 GKI (KMI gen 8). The exact device commit 004a97f76e10 is NOT published by OnePlus (GPL source lags the OTA), but GKI guarantees identical core struct layouts (task_struct/pt_regs/kretprobe) across the whole 6.6 generation, so building against the public android15-6.6 branch with the device real config (running.config) yields a module whose layouts match the device. Load with "insmod -f" to cover any vermagic/CRC diff.'
        required: false
        default: 'android15-6.6'
  push:
    paths:
      - 'smaps_hide.c'
      - 'Kbuild'
      - 'running.config'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KBUILD_MODPOST_WARN: "1"
    steps:
      - name: Checkout module sources
        uses: actions/checkout@v4

      - name: Fast toolchain setup (ubuntu-24.04)
        run: |
          clang --version | head -1
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            llvm-18 lld-18 flex bison bc libelf-dev libssl-dev
          # LLVM=1 需要无后缀的 llvm-* 工具（llvm-18-tools 只提供带 -18 后缀的）
          for t in ar nm objcopy objdump readelf strip as; do
            sudo ln -sf /usr/lib/llvm-18/bin/llvm-$t /usr/local/bin/llvm-$t
          done
          sudo ln -sf /usr/lib/llvm-18/bin/ld.lld /usr/local/bin/ld.lld
          clang --version | head -1; ld.lld --version | head -1

      # 公共 AOSP common GKI android15-6.6。GKI 保证核心结构体布局在 6.6 代次内
      # ABI 稳定，故无需 pin 到设备私有提交 004a97f76e10（OnePlus 尚未开源该版）。
      # 只有运行内核的“真实 config”（running.config）才决定 task_struct/pt_regs 布局。
      # 用 --depth 1 只取一个提交（外部模块构建不需要历史），让 clone 直接检出顶端。
      - name: Fetch AOSP common GKI android15-6.6 kernel
        timeout-minutes: 20
        run: |
          git clone --filter=blob:none --depth 1 \
            --branch "${{ github.event.inputs.kernel_ref || 'android15-6.6' }}" \
            https://android.googlesource.com/kernel/common "$HOME/kernel"
          cd "$HOME/kernel"
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)"
          echo "KERNEL_VERSION=$(make -s kernelversion 2>/dev/null || true)"

      # 用设备真实 config（running.config，来自 /proc/config.gz）而非 gki_defconfig，
      # 否则缺 PTR_AUTH_KERNEL / SHADOW_CALL_STACK / KASAN_HW_TAGS / 全抢占等开关，
      # 结构体布局与运行内核不符 => insmod -f 后瞬间 panic / 重启。
      # 注：running.config 里的 OPlus 厂商选项在公共树里不存在，olddefconfig 会丢弃，
      # 但那些只影响驱动，不影响核心结构布局，无害。
      - name: Prepare kernel tree with device real config
        timeout-minutes: 15
        run: |
          cd "$HOME/kernel"
          export ARCH=arm64
          export OUT_DIR="$HOME/kernel/out"
          mkdir -p "$OUT_DIR"
          if [ ! -f "$GITHUB_WORKSPACE/running.config" ]; then
            echo "ERROR: running.config missing from repo root; capture it via 'adb shell zcat /proc/config.gz > running.config'"
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/running.config" "$OUT_DIR/.config"
          make O="$OUT_DIR" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          # 外部模块必需：生成 modpost 脚本与内核头文件
          make O="$OUT_DIR" ARCH=arm64 LLVM=1 LLVM_IAS=1 -j"$(nproc)" modules_prepare
          echo "=== kernel ready for external modules ==="
          ls -l "$OUT_DIR/.config"

      - name: Build smaps_hide.ko
        timeout-minutes: 10
        run: |
          cd "$GITHUB_WORKSPACE"
          KOUT="$HOME/kernel/out"
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            -C "$HOME/kernel" O="$KOUT" M="$PWD" modules 2>&1
          echo "--- artifacts ---"
          ls -la *.ko

      - name: Report vermagic (insmod -f expected)
        run: |
          KO="$GITHUB_WORKSPACE/smaps_hide.ko"
          VM="$(readelf -p .modinfo "$KO" 2>/dev/null | grep -i vermagic | sed 's/.*vermagic=//;s/ .*//')"
          echo "Module vermagic: $VM"
          echo "Device vermagic: 6.6.147-android15-8-g004a97f76e10-4k"
          echo "NOTE: exact SHA differs (OnePlus has not published 004a97f76e10); GKI layout matches, so load with: insmod -f smaps_hide.ko"

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smaps_hide-ko
          path: |
            *.ko
            module/module.prop
            module/post-fs-data.sh
            README.md
