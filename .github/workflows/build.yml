name: build-smaps-hide
on:
  workflow_dispatch:
    inputs:
      kernel_sha:
        description: 'AOSP common kernel android15-6.6 commit SHA (leave default)'
        required: false
        default: '004a97f76e10'
  push:
    paths:
      - 'smaps_hide.c'
      - 'Kbuild'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KBUILD_MODPOST_WARN: "1"
    steps:
      - name: Checkout module sources
        uses: actions/checkout@v4

      - name: Setup toolchain (install llvm-18-tools)
        run: |
          # 1. 更新包列表（必须，否则安装旧版本或失败）
          sudo apt-get update -qq
          # 2. 安装完整工具链：clang-18, lld-18, llvm-18-tools (含 readelf/nm/objcopy)
          sudo apt-get install -y -qq clang-18 lld-18 llvm-18-tools 2>&1 | tail -5
          # 验证关键工具
          which llvm-readelf-18 llvm-nm-18 llvm-objcopy-18 ld.lld-18
          # 创建无版本号软链接供内核构建系统使用
          sudo ln -sf "$(command -v llvm-readelf-18)" /usr/local/bin/llvm-readelf
          sudo ln -sf "$(command -v llvm-nm-18)" /usr/local/bin/llvm-nm
          sudo ln -sf "$(command -v llvm-objcopy-18)" /usr/local/bin/llvm-objcopy
          sudo ln -sf "$(command -v ld.lld-18)" /usr/local/bin/ld.lld
          # 验证无版本号命令可用
          llvm-readelf --version | head -1
          llvm-nm --version | head -1
          llvm-objcopy --version | head -1
          ld.lld --version | head -1

      - name: Fetch AOSP common android15-6.6 kernel
        timeout-minutes: 10
        run: |
          git clone --depth 1 --branch android15-6.6 https://android.googlesource.com/kernel/common "$HOME/kernel" \
            || git clone https://android.googlesource.com/kernel/common "$HOME/kernel"
          cd "$HOME/kernel"
          SHA="${{ github.event.inputs.kernel_sha || '004a97f76e10' }}"
          if [ -n "$SHA" ] && ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
            git fetch --depth 1 origin "$SHA" 2>/dev/null || true
          fi
          if [ -n "$SHA" ] && git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
            git checkout -q "$SHA"
          fi
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)"

      - name: Prepare kernel (defconfig + scripts + modules_prepare)
        timeout-minutes: 15
        run: |
          cd "$HOME/kernel"
          export ARCH=arm64
          make LLVM=1 LLVM_IAS=1 gki_defconfig
          scripts/config --enable CONFIG_KPROBES --enable CONFIG_KALLSYMS --enable CONFIG_KALLSYMS_ALL 2>&1 || true
          # 必须先运行 make scripts，生成 modpost 等必须脚本
          make LLVM=1 LLVM_IAS=1 -j"$(nproc)" scripts 2>&1
          # 再运行 modules_prepare 为外部模块链接做准备
          make LLVM=1 LLVM_IAS=1 -j"$(nproc)" modules_prepare 2>&1
          echo "=== kernel ready for external modules ==="

      - name: Build smaps_hide.ko
        timeout-minutes: 10
        run: |
          cd "$GITHUB_WORKSPACE"
          make ARCH=arm64 LLVM=1 -C "$HOME/kernel" M="$PWD" modules 2>&1
          echo "--- artifacts ---"
          ls -la *.ko
          strings smaps_hide.ko | grep -m1 vermagic || true

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smaps_hide-ko
          path: |
            *.ko
            module/module.prop
            module/post-fs-data.sh
            README.md