name: build-smaps-hide
on:
  workflow_dispatch:
    inputs:
      kernel_sha:
        description: 'AOSP common kernel android15-6.6 commit SHA (leave default)'
        required: false
        default: '004a97f76e10'
  push:
    paths:
      - 'smaps_hide.c'
      - 'Kbuild'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KBUILD_MODPOST_WARN: "1"
    steps:
      - name: Checkout module sources
        uses: actions/checkout@v4

      - name: Fast toolchain setup (ubuntu-24.04 has clang-18)
        run: |
          clang --version | head -1
          sudo apt-get install -y -qq --no-install-recommends llvm-18-tools 2>/dev/null | tail -2
          sudo apt-get install -y -qq --no-install-recommends lld-18 2>/dev/null | tail -2
          sudo ln -sf "$(command -v ld.lld-18)" /usr/local/bin/ld.lld
          ld.lld --version | head -1
          export CC=clang-18   # 【关键】显式指定 clang-18，锁定 GKI 6.6 编译环境

      - name: Fetch AOSP common android15-6.6 kernel
        timeout-minutes: 10
        run: |
          git clone --depth 1 --branch android15-6.6 https://android.googlesource.com/kernel/common "$HOME/kernel" \
            || git clone https://android.googlesource.com/kernel/common "$HOME/kernel"
          cd "$HOME/kernel"
          SHA="${{ github.event.inputs.kernel_sha || '004a97f76e10' }}"
          if [ -n "$SHA" ] && ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
            git fetch --depth 1 origin "$SHA" 2>/dev/null || true
          fi
          if [ -n "$SHA" ] && git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
            git checkout -q "$SHA"
          fi
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)"

      - name: Prepare kernel (defconfig + scripts + modules_prepare)
        timeout-minutes: 15
        run: |
          cd "$HOME/kernel"
          export ARCH=arm64
          make LLVM=1 LLVM_IAS=1 gki_defconfig
          scripts/config --enable CONFIG_KPROBES --enable CONFIG_KALLSYMS --enable CONFIG_KALLSYMS_ALL 2>/dev/null || true
          make LLVM=1 LLVM_IAS=1 -j"$(nproc)" scripts 2>/dev/null
          make LLVM=1 LLVM_IAS=1 -j"$(nproc)" modules_prepare 2>/dev/null
          echo "=== kernel ready for external modules ==="

      - name: Build smaps_hide.ko
        timeout-minutes: 10
        run: |
          cd "$GITHUB_WORKSPACE"
          make ARCH=arm64 LLVM=1 -C "$HOME/kernel" M="$PWD" modules 2>/dev/null
          echo "--- artifacts ---"
          ls -la *.ko
          strings smaps_hide.ko | grep -m1 vermagic || true

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smaps_hide-ko
          path: |
            *.ko
            module/module.prop
            module/post-fs-data.sh
            README.md