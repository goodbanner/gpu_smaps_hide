name: build-smaps-hide
on:
  workflow_dispatch:
    inputs:
      kernel_sha:
        description: 'Kernel source commit SHA (full 40-char, or abbreviated). Default 004a97f76e10 is verified against this device (/proc/version: 6.6.147-android15-8-g004a97f76e10-...-4k). Leave default to match device.'
        required: false
        default: '004a97f76e10'
  push:
    paths:
      - 'smaps_hide.c'
      - 'Kbuild'
      - 'running.config'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KBUILD_MODPOST_WARN: "1"
    steps:
      - name: Checkout module sources
        uses: actions/checkout@v4

      - name: Fast toolchain setup (ubuntu-24.04)
        run: |
          clang --version | head -1
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            llvm-18 lld-18 flex bison bc libelf-dev libssl-dev
          # LLVM=1 需要无后缀的 llvm-* 工具（llvm-18-tools 只提供带 -18 后缀的）
          for t in ar nm objcopy objdump readelf strip as; do
            sudo ln -sf /usr/lib/llvm-18/bin/llvm-$t /usr/local/bin/llvm-$t
          done
          sudo ln -sf /usr/lib/llvm-18/bin/ld.lld /usr/local/bin/ld.lld
          clang --version | head -1; ld.lld --version | head -1

      # 必须构建在与设备一致的内核源码 commit 上，否则 task_struct / pt_regs /
      # kretprobe_instance 等结构体布局不同，kretprobe 处理函数会解引用错误地址
      # 导致 insmod -f 后瞬间 panic / 重启。
      #
      # 注意：004a97f76e10 只是 git describe 的缩写 SHA，不能用 “git fetch origin <缩写>”
      # 去取（会被当成引用名，远端没有该分支而报错）。正确做法是克隆 android15-6.6
      # 分支（其历史包含该 commit），再在本地用 git rev-parse 展开后 checkout。
      - name: Fetch AOSP common android15-6.6 kernel at exact device commit
        timeout-minutes: 20
        run: |
          git clone --filter=blob:none --branch android15-6.6 --no-checkout \
            https://android.googlesource.com/kernel/common "$HOME/kernel"
          cd "$HOME/kernel"
          SHA="${{ github.event.inputs.kernel_sha || '004a97f76e10' }}"
          # 在本地把缩写 SHA 展开为完整 40 字符；对象已在分支历史中，可解析
          FULL="$(git rev-parse --verify "${SHA}^{commit}" 2>/dev/null || true)"
          if [ -z "$FULL" ]; then
            echo "ERROR: commit $SHA not found in android15-6.6 history"
            exit 1
          fi
          git checkout -q "$FULL"
          echo "KERNEL_COMMIT=$FULL"
          # 校验：必须真的停在目标 commit，否则直接失败
          if [ "$(git rev-parse HEAD)" != "$FULL" ]; then
            echo "ERROR: checked out $(git rev-parse HEAD), expected $FULL"
            exit 1
          fi

      # 用设备真实 config（running.config，来自 /proc/config.gz）而非 gki_defconfig，
      # 否则缺 PTR_AUTH_KERNEL / SHADOW_CALL_STACK / KASAN_HW_TAGS / 全抢占等开关，
      # 结构体布局与运行内核不符。
      - name: Prepare kernel tree with device real config
        timeout-minutes: 15
        run: |
          cd "$HOME/kernel"
          export ARCH=arm64
          export OUT_DIR="$HOME/kernel/out"
          mkdir -p "$OUT_DIR"
          if [ ! -f "$GITHUB_WORKSPACE/running.config" ]; then
            echo "ERROR: running.config missing from repo root; capture it via 'adb shell zcat /proc/config.gz > running.config'"
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/running.config" "$OUT_DIR/.config"
          make O="$OUT_DIR" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          # 外部模块必需：生成 modpost 脚本与内核头文件
          make O="$OUT_DIR" ARCH=arm64 LLVM=1 LLVM_IAS=1 -j"$(nproc)" modules_prepare
          echo "=== kernel ready for external modules ==="
          ls -l "$OUT_DIR/.config"

      - name: Build smaps_hide.ko
        timeout-minutes: 10
        run: |
          cd "$GITHUB_WORKSPACE"
          KOUT="$HOME/kernel/out"
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            -C "$HOME/kernel" O="$KOUT" M="$PWD" modules 2>&1
          echo "--- artifacts ---"
          ls -la *.ko

      - name: Verify vermagic matches device kernel
        run: |
          KO="$GITHUB_WORKSPACE/smaps_hide.ko"
          VM="$(readelf -p .modinfo "$KO" 2>/dev/null | grep -i vermagic | sed 's/.*vermagic=//;s/ .*//')"
          echo "Module vermagic: $VM"
          echo "Expected prefix: 6.6.147-android15-8-g004a97f76e10"
          case "$VM" in
            *004a97f76e10*) echo "OK: vermagic matches device commit" ;;
            *) echo "WARNING: vermagic does NOT contain 004a97f76e10; do NOT load this .ko"; exit 1 ;;
          esac

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smaps_hide-ko
          path: |
            *.ko
            module/module.prop
            module/post-fs-data.sh
            README.md
