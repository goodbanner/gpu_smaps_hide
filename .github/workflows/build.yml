name: build-smaps-hide
on:
  workflow_dispatch:
    inputs:
      kernel_sha:
        description: 'AOSP common kernel android15-6.6 commit SHA (leave default)'
        required: false
        default: '004a97f76e10'
  push:
    paths:
      - 'smaps_hide.c'
      - 'Kbuild'
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout module sources
        uses: actions/checkout@v4

      - name: Install clang-18 + kernel build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18 lld-18 llvm-18 llvm-18-tools \
            make flex bison bc libssl-dev libelf-dev dwarves rsync cpio python3
          for t in clang clang++ llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf \
                    llvm-strip ld.lld clang-cpp llvm-as llvm-ranlib llvm-size; do
            if command -v "$t-18" >/dev/null 2>&1; then sudo ln -sf "$(command -v "$t-18")" /usr/local/bin/$t; fi
          done
          clang --version | head -1

      - name: Fetch AOSP common android15-6.6 kernel
        run: |
          git clone --depth 1 --branch android15-6.6 https://android.googlesource.com/kernel/common "$HOME/kernel" \
            || git clone https://android.googlesource.com/kernel/common "$HOME/kernel"
          cd "$HOME/kernel"
          SHA="${{ github.event.inputs.kernel_sha || '004a97f76e10' }}"
          if [ -n "$SHA" ] && ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
            git fetch --depth 1 origin "$SHA" 2>/dev/null || true
          fi
          if [ -n "$SHA" ] && git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
            git checkout -q "$SHA"
          fi
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)"
          git rev-parse HEAD > /tmp/kernel_sha

      - name: Prepare kernel (gki_defconfig + modules_prepare)
        run: |
          cd "$HOME/kernel"
          export ARCH=arm64
          make LLVM=1 LLVM_IAS=1 gki_defconfig
          grep -q "CONFIG_KPROBES=y" .config || echo "WARN: CONFIG_KPROBES not set in defconfig"
          make LLVM=1 LLVM_IAS=1 -j"$(nproc)" modules_prepare 2>&1 | tail -20

      - name: Build smaps_hide.ko
        run: |
          cd "$GITHUB_WORKSPACE"
          make ARCH=arm64 LLVM=1 -C "$HOME/kernel" M="$PWD" modules 2>&1 | tail -20
          ls -la *.ko
          strings smaps_hide.ko | grep -m1 vermagic || true

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smaps_hide-ko
          path: |
            *.ko
            module/module.prop
            module/post-fs-data.sh
            README.md
